name: Simple CML Report Test

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  cml-test:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup CML
        uses: iterative/setup-cml@v2

      - name: Post CML comment
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "# ✅ CML Report Test" > report.md
          echo "This workflow ran successfully 🎉" >> report.md
          echo "Triggered by: ${{ github.event_name }}" >> report.md
          echo "Branch: ${{ github.ref_name }}" >> report.md
          echo "Run time: $(date)" >> report.md
          cml comment create report.md
