name: CI Pipeline - Feast + DVC + MLflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # allows manual trigger

jobs:
  test-pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2️⃣ Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dvc[gs] feast mlflow scikit-learn pandas pyarrow joblib

      # 4️⃣ Authenticate GCP (optional if your DVC remote is GCS)
      - name: Authenticate to Google Cloud
        if: ${{ secrets.GCP_SA_KEY }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIAL }}

      # 5️⃣ Pull data using DVC
      - name: Pull data from DVC remote
        run: |
          dvc pull data -v

      # 6️⃣ Run the test pipeline (end-to-end)
      - name: Run pipeline test
        run: |
          python test_pipeline.py

      # 7️⃣ Upload test artifacts (optional)
      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-artifacts
          path: artifacts/
          if-no-files-found: ignore

      # 8️⃣ (Optional) Comment results to PR using CML
      - name: Post CML Report
        if: github.event_name == 'pull_request'
        uses: iterative/setup-cml@v2
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "# 🧪 Pipeline Test Summary" > report.md
          echo "\`\`\`" >> report.md
          python test_pipeline.py >> report.md 2>&1
          echo "\`\`\`" >> report.md
          cml comment create report.md
