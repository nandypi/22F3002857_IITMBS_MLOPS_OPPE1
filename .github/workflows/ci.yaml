name: CI Pipeline - DVC + Feast + Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir dvc[gs] feast mlflow scikit-learn pandas pyarrow joblib

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          # <-- Make sure you have created the repository secret `GCP_SA_KEY`
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Show authenticated account (debug)
        run: |
          gcloud auth list || true
          gsutil ls gs:// || true

      - name: DVC pull data from remote
        run: |
          dvc pull -v

      - name: Run end-to-end pipeline test
        run: |
          python test_pipeline.py

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-artifacts
          path: artifacts/
          if-no-files-found: ignore
