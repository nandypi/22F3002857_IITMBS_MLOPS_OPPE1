name: CI Test with CML

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cml==0.9.2  # lightweight stable version

      - name: Run simple test
        run: |
          echo "All good! Running simple CI test." > report.md
          echo "✅ CI is working fine with CML!" >> report.md
          echo "Current date: $(date)" >> report.md

      - name: Post CML report as PR comment
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cml comment create report.md
