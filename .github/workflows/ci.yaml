name: CI Pipeline - Fast

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  full-pipeline:
    name: Run Full Pipeline (Fast)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      # -------------------------------
      # 1️⃣ Checkout repository
      # -------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------------
      # 2️⃣ Cache dependencies
      # -------------------------------
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # -------------------------------
      # 3️⃣ Set up Python
      # -------------------------------
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # -------------------------------
      # 4️⃣ Install dependencies
      # -------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      # -------------------------------
      # 5️⃣ Authenticate to Google Cloud
      # -------------------------------
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # -------------------------------
      # 6️⃣ Pull data using DVC
      # -------------------------------
      - name: DVC pull data
        run: |
          dvc pull -v

      # -------------------------------
      # 7️⃣ Process data for Feast
      # -------------------------------
      - name: Run data processing
        run: |
          python process_data.py

      # -------------------------------
      # 8️⃣ Apply Feast (register feature store)
      # -------------------------------
      - name: Apply Feast repo
        run: |
          cd feature_repo
          feast apply
          cd ..

      # -------------------------------
      # 9️⃣ Run pipeline test
      # -------------------------------
      - name: Run test pipeline
        run: |
          python test_pipeline.py

      # -------------------------------
      # 🔟 Upload artifacts (model + metrics)
      # -------------------------------
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-artifacts
          path: artifacts/
          if-no-files-found: ignore
